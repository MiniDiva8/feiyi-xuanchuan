name: 开发任务
description: 一个负责人、一个明确范围、一个可验收的 PR
title: "[任务] "
labels: ["status:ready"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 本次涉及模块（不是权限限制）
      options:
        - frontend / MiniDiva8
        - backend / donghaochen45-pixel
        - ai / zhupaifan
        - cross-module / 三人均可修改全部代码
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与期望结果
      description: 描述具体触发条件和可观察的完成状态。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 允许修改路径
      description: 每行一个仓库内路径；三人均可跨目录开发。列明本次任务范围，避免并发改动冲突。
      placeholder: apps/web/
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准与验证方法
      placeholder: |
        - [ ] 可观察行为：
        - [ ] 测试命令或操作：
        - [ ] 错误情况：
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖、接口和阻塞
      description: 关联其他 Issue/PR，列明尚未确定的契约。
  - type: checkboxes
    id: assignment
    attributes:
      label: 认领规则
      options:
        - label: 创建后在 Assignees 中只设置一名负责人；本表单不会自动指派账号。
          required: true
        - label: 同一 Issue 只运行一条实现分支；不重复启动多个实现任务。
          required: true
